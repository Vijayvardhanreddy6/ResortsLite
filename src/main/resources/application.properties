# cr-java-0065 FIX: Spring Session with Amazon ElastiCache for Redis configuration.
# All HttpSession operations in BookingController are now transparently backed by Redis,
# enabling stateless application instances and safe horizontal scaling across EC2 instances.
#
# Set REDIS_HOST and REDIS_PORT environment variables at deployment time (ECS task definition /
# EKS pod env vars / Elastic Beanstalk environment properties) to point to the ElastiCache
# Redis primary endpoint for each environment.
#
# Provision an ElastiCache Redis cluster and note its primary endpoint, then inject:
#   REDIS_HOST=<cluster-primary-endpoint>
#   REDIS_PORT=6379
#   SESSION_TIMEOUT_SECONDS=1800   (optional — defaults to 1800 s / 30 min)
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Optional: TLS for ElastiCache in-transit encryption (recommended for production)
spring.redis.ssl=${REDIS_SSL:false}
# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Replaces the former unbounded in-memory HashMap (bookingCache) with a Redis-backed
# cache entry that expires automatically after the configured TTL. This prevents
# indefinite memory growth, stale data across instances, and cache inconsistency in
# horizontally scaled cloud environments.
#
# Override via the BOOKING_CACHE_TTL_SECONDS environment variable at deployment time
# (ECS task definition / EKS pod env vars / Elastic Beanstalk environment properties).
# Default: 1800 seconds (30 minutes).
app.cache.booking-ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}

# The server.port property below is the Spring Boot binding; it falls back to the SERVER_PORT
# environment variable (injected by ECS task definition / EKS pod spec / Elastic Beanstalk).
server.port=${SERVER_PORT:8080}
app.ssm.server-port-param=${SERVER_PORT_PARAM_NAME:/resorts/server/port}
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061 FIX: Amazon S3 configuration replacing hard-coded file paths.
# Override these via environment variables REPORTS_S3_BUCKET, BACKUP_S3_PREFIX,
# and AWS_REGION at deployment time (ECS task definition / EKS pod env vars).
app.reports.s3.bucket=${REPORTS_S3_BUCKET:resorts-reports-bucket}
app.reports.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}

# AWS region — sourced from environment variable AWS_REGION at runtime
cloud.aws.region.static=${AWS_REGION:us-east-1}


# cr-java-0071 FIX: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# These replace hard-coded environment URLs in BookingController.java (line 66) and
# ReportService.java (line 66) with runtime lookups from AWS SSM Parameter Store,
# enabling environment-agnostic deployments without code changes.
#
# Provision the actual URL values in AWS SSM Parameter Store before deployment:
#   aws ssm put-parameter --name "/resorts/inventory/url" \
#       --value "https://inventory-service.internal:8081/rooms/available" --type String
#   aws ssm put-parameter --name "/resorts/reports/download-base-url" \
#       --value "https://reports.resorts-internal.com:8080/download/" --type String
#
# Override the parameter names per environment via environment variables.
app.ssm.inventory-url-param=${INVENTORY_URL_PARAM_NAME:/resorts/inventory/url}
app.ssm.report-download-base-url-param=${REPORT_DOWNLOAD_URL_PARAM_NAME:/resorts/reports/download-base-url}
# Set the DB_SECRET_NAME environment variable at deployment time (ECS task definition /
# EKS pod env vars / Lambda environment) to point to the correct secret ARN or name.
DB_SECRET_NAME=${DB_SECRET_NAME:resorts/db/credentials}

# cr-java-0090 FIX: Amazon Cognito User Pool configuration for cloud-native authentication.
# Replaces file-based / local-hash authentication (original BookingService.java line 108)
# with Amazon Cognito User Pool identity management.
#
# Provision a Cognito User Pool and App Client, then inject the following environment
# variables at deployment time (ECS task definition / EKS pod env vars / Elastic Beanstalk):
#   COGNITO_USER_POOL_ID=us-east-1_XXXXXXXXX   (from AWS Console → Cognito → User Pools)
#   COGNITO_APP_CLIENT_ID=<app-client-id>       (from User Pool → App clients)
#
# The App Client must have ALLOW_ADMIN_USER_PASSWORD_AUTH enabled and must NOT have a
# client secret (or the AdminInitiateAuth call must include the SECRET_HASH parameter).
#
# Override per environment via environment variables — no code redeployment required.
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:us-east-1_placeholder}
COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID:placeholder-client-id}
