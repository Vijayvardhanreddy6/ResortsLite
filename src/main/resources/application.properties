# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port now configurable via environment variable
# In ECS/EKS, set SERVER_PORT environment variable for dynamic port assignment
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials externalized to AWS Secrets Manager
# Connection details retrieved at runtime from Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and caching
# Configure ElastiCache Redis endpoint via environment variables
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Spring Session with Redis
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=30m

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# In production, these values are retrieved from Parameter Store at startup
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
app.reports.download.endpoint=${REPORTS_DOWNLOAD_ENDPOINT:https://reports.resorts-internal.com/download}

# FIXED cr-java-0069: AWS Secrets Manager configuration
aws.secrets.database.name=${AWS_SECRET_DB_NAME:resorts-db-credentials}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: AWS S3 configuration for file storage
aws.s3.reports.bucket=${S3_REPORTS_BUCKET:resorts-reports-bucket}
aws.s3.backups.bucket=${S3_BACKUPS_BUCKET:resorts-backups-bucket}

# Logging configuration for cloud environments
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for health checks (ECS/EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
