# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for cloud environments (ECS/EKS)
# Fixed: cr-java-0077 - Replace hard-coded ports with environment variable injection
server.port=${SERVER_PORT:8080}

# Database configuration with externalized credentials
# Fixed: cr-java-0069 - Replace hard-coded database credentials with AWS Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# HikariCP connection pooling configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Spring Session with Redis for distributed session management
# Fixed: cr-java-0065 - Replace HTTP session storage with Amazon ElastiCache for Redis
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.namespace=resortslite:session
spring.session.timeout=${SESSION_TIMEOUT:1800}

# AWS Configuration
# Fixed: cr-java-0071 - Externalize environment URLs using AWS Systems Manager Parameter Store
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${S3_BUCKET_NAME:resortslite-reports}
aws.secrets.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# Externalized service endpoints
# Fixed: cr-java-0071 - Replace hard-coded environment URLs with Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-svc:7070/send}

# File storage configuration
# Fixed: cr-java-0061, cr-java-0062, cr-java-0063 - Replace hard-coded file paths with S3
app.storage.type=${STORAGE_TYPE:s3}
app.storage.s3.reports.prefix=${S3_REPORTS_PREFIX:reports/}
app.storage.s3.backups.prefix=${S3_BACKUPS_PREFIX:backups/}

# Time zone configuration
# Fixed: cr-java-0111 - Standardize on UTC for all time operations
spring.jackson.time-zone=UTC
app.timezone=${APP_TIMEZONE:UTC}
